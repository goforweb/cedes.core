[transform-fullname]
blueprint = collective.transmogrifier.sections.inserter
key = string:fullname
value = python: item['firstname'].strip() + ' ' + item['fullname'].strip()
condition = python: item['_type'] == 'CedesMember'

[insert-first_login_time]
blueprint = collective.transmogrifier.sections.inserter
key = string:first_login_time
value = python: item['creation_date']
condition = python: item['_type'] == 'CedesMember'

[transform-first_login_time]
blueprint = collective.transmogrifier.sections.inserter
key = string:first_login_time
value = python: modules['DateTime'].DateTime(item['first_login_time'])
condition = python: item['_type'] == 'CedesMember'

[transform-last_login_time]
blueprint = collective.transmogrifier.sections.inserter
key = string:last_login_time
value = python: modules['DateTime'].DateTime(item['last_login_time'])
condition = python: item['_type'] == 'CedesMember'

[transform-login_time]
blueprint = collective.transmogrifier.sections.inserter
key = string:login_time
value = python: modules['DateTime'].DateTime(item['login_time'])
condition = python: item['_type'] == 'CedesMember'

[transform-account_bills]
blueprint = collective.transmogrifier.sections.inserter
key = string:account_bills
value = python: eval(item['account_bills'].replace("'pdf': '", "'pdf': b'"), {'DateTime': modules['DateTime'].DateTime})
condition = python: item['_type'] == 'CedesMember'

[transform-account_transactions]
blueprint = collective.transmogrifier.sections.inserter
key = string:account_transactions
value = python: eval(item['account_transactions'].replace("GMT+1')", "GMT+1').strftime('%d/%m/%Y (%H:%M)')").replace("GMT+2')", "GMT+2').strftime('%d/%m/%Y (%H:%M)')").replace('\\xc3\\xa9', 'é'), {'DateTime': modules['DateTime'].DateTime})
condition = python: item['_type'] == 'CedesMember'

[addUser]
blueprint = collective.transmogrifier.sections.inserter
key = nothing
condition = python:('id' in item and 'password' in item and
    transmogrifier.context.portal_membership.addMember(id=item['id'], password=item['password'], roles=['Member'], domains=[], properties=dict(
        (key, hasattr(value, 'strip') and value.strip() or value) for key, value in item.items()
        if key.startswith('bill') or key.startswith('school') or key.startswith('account') or key in ['email', 'fullname', 'member_type', 'last_login_time', 'first_login_time', 'legal_validation', 'login_time'])) and False)
value = nothing

[logger]
blueprint = collective.transmogrifier.sections.logger
name = logger
level = DEBUG
key = _id
