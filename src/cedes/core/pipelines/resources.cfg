[transmogrifier]
pipeline =
    remotesource
    removeid
    adaptfieldnames
    transform-effectiveDate
    transform-expirationDate
    transform-cr_first_classification_date
    transform-text-resolveuid
    transform-cr_html_preview-resolveuid
    order
    constructor
    transform-yays
    schema
    uid
    datesupdate
    todayinserter
    transitionsinserter
    workflowupdater
#    permissions
    owner
    local_roles
    mimetype
    reindexobject
    logger

[misc]
today = string:2018-12-19

[remotesource]
blueprint = collective.jsonmigrator.catalogsource
remote-url=http://cedesplone4a.goforweb.be
remote-path=/
remote-username=jeanbaltus
remote-password=jojo2
catalog-path = /sitecedes/portal_catalog
catalog-query =
